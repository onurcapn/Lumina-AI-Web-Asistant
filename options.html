<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina AI - Ayarlar</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --radius: 12px;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .field {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    select, input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    select:focus, input:focus {
      border-color: var(--primary);
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    .hint a {
      color: var(--primary);
      text-decoration: none;
    }

    .hint a:hover {
      text-decoration: underline;
    }

    .hint code {
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 4px;
      border-radius: 4px;
    }

    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .status {
      text-align: center;
      font-size: 13px;
      margin-top: 16px;
      min-height: 1.2em;
    }

    .status.success { color: #10b981; }
    .status.error { color: #ef4444; }

    hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h1 data-i18n="title">Lumina AI Yapılandırması</h1>
      <select id="language" style="width: auto; padding: 4px 8px; font-size: 12px; height: 28px;">
        <option value="tr">TR</option>
        <option value="en">EN</option>
      </select>
    </div>
    <p class="subtitle" data-i18n="subtitle">Yapay zeka sağlayıcınızı seçin ve API anahtarınızı girin.</p>

    <div class="card">
      <div class="field">
        <label for="provider" data-i18n="labelProvider">Yapay Zeka Sağlayıcı</label>
        <select id="provider">
          <option value="grok">Grok (xAI)</option>
          <option value="groq">Groq (LPU) - Çok Hızlı!</option>
          <option value="openai">OpenAI (GPT-4o)</option>
          <option value="gemini">Google Gemini</option>
          <option value="anthropic">Anthropic Claude</option>
        </select>
      </div>

      <div class="field">
        <label for="apiKey" data-i18n="labelApiKey">API Anahtarı</label>
        <input type="password" id="apiKey" placeholder="API anahtarınızı girin...">
        <div class="hint" id="apiKeyHint" data-i18n="apiKeyHint">Anahtarınız yalnızca tarayıcınızda yerel olarak saklanır.</div>
      </div>

      <div class="field">
        <label for="modelName" data-i18n="labelModelName">Model İsmi</label>
        <input type="text" id="modelName" placeholder="Varsayılan model kullanılır">
        <div class="hint" id="modelHint">Örn: <code>grok-beta</code></div>
      </div>

      <hr>

      <div class="field">
        <label for="panelOpacity" data-i18n="labelOpacity">Panel Saydamlığı</label>
        <div style="display: flex; align-items: center; gap: 12px;">
          <input type="range" id="panelOpacity" min="50" max="100" step="1" value="90" style="padding: 0; height: 6px; cursor: pointer;">
          <span id="opacityValue" style="font-size: 13px; font-weight: 600; min-width: 40px;">90%</span>
        </div>
      </div>

      <button id="save" data-i18n="btnSave">Değişiklikleri Kaydet</button>
      <div class="status" id="status"></div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
